name: 02 - Deploy to Staging

on:
  workflow_run:
    workflows:
      - "01 - CI"
    types:
      - completed
    branches:
      - main

jobs:
  deploy-staging:
    name: Deploy frontend to App Service staging slot
    runs-on: ubuntu-latest

    if: >
      ${{ github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: staging

    env:
      APP_SERVICE_NAME: koalatech-week08-webapp-226035073
      RESOURCE_GROUP: koalatech-week08-rg
      SLOT_NAME: staging
      ACR_NAME: koalatech8acr226035073
      ACR_LOGIN_SERVER: koalatech8acr226035073.azurecr.io
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
      IMAGE_NAME: koalatech-frontend

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR credentials
        id: acr
        run: |
          ACR_USERNAME=$(az acr credential show \
            --name "$ACR_NAME" \
            --query username \
            --output tsv)

          ACR_PASSWORD=$(az acr credential show \
            --name "$ACR_NAME" \
            --query 'passwords[0].value' \
            --output tsv)

          echo "ACR_USERNAME=$ACR_USERNAME" >> "$GITHUB_ENV"
          echo "ACR_PASSWORD=$ACR_PASSWORD" >> "$GITHUB_ENV"

      - name: Configure App Service staging container image
        run: |
          echo "Deploying ${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${IMAGE_TAG} to slot ${SLOT_NAME}"

          az webapp config container set \
            --name "$APP_SERVICE_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --slot "$SLOT_NAME" \
            --container-image-name "${IMAGE_NAME}:${IMAGE_TAG}" \
            --container-registry-url "https://${ACR_LOGIN_SERVER}" \
            --container-registry-user "$ACR_USERNAME" \
            --container-registry-password "$ACR_PASSWORD"

      - name: Restart staging slot
        run: |
          az webapp restart \
            --name "$APP_SERVICE_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --slot "$SLOT_NAME"

      - name: Show App Service staging status
        run: |
          az webapp show \
            --name "$APP_SERVICE_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --slot "$SLOT_NAME" \
            --query '{name:name, state:state, defaultHostName:defaultHostName, slot:slotSwapStatus}' \
            -o table